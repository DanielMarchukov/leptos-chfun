name: PR Open

# Runs on every PR targeting mainline AND on every direct push to mainline.
# Responsibility: prove the change is formatted, passes clippy on BOTH the
# server (ssr) and client (hydrate/wasm) sides, and produces a valid
# cargo-leptos build. No deployment happens here.

on:
  pull_request:
    branches: [mainline]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [mainline]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Format, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Draft PRs get skipped, but push events have no draft field so they always run.
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (stable + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          shared-key: leptos-chfun-ci

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Two clippy passes: the server (ssr, native) and the client
      # (hydrate, wasm32). NEVER use `--all-features` on the wasm target — it
      # enables `ssr`, which pulls in Tokio's `net` feature (mio), and mio does
      # not compile for wasm ("This wasm target is unsupported by mio").
      - name: Clippy (server / ssr, native)
        run: cargo clippy --features ssr -- -D warnings

      - name: Clippy (client / hydrate, wasm32)
        run: cargo clippy --lib --target wasm32-unknown-unknown --features hydrate -- -D warnings

      - name: Install cargo-leptos
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos

      - name: Build (cargo-leptos, release)
        run: cargo leptos build --release
