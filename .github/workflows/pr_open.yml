name: PR Open

# Runs on PRs to mainline and pushes to mainline: fmt + clippy (ssr + hydrate)
# + a Docker build/run smoke test. No deployment here. See README (CI split).

on:
  pull_request:
    branches: [mainline]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [mainline]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Format, lint, build
    runs-on: namespace-profile-dev
    timeout-minutes: 30
    # Draft PRs get skipped, but push events have no draft field so they always run.
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (stable + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          shared-key: leptos-chfun-ci

      - name: Check formatting
        run: cargo fmt --all -- --check

      # ssr (native) + hydrate (wasm32). Never use --all-features on the wasm
      # target — it pulls in ssr's Tokio/mio, which doesn't build for wasm.
      - name: Clippy (server / ssr, native)
        run: cargo clippy --features ssr -- -D warnings

      - name: Clippy (client / hydrate, wasm32)
        run: cargo clippy --lib --target wasm32-unknown-unknown --features hydrate -- -D warnings

      # No cargo leptos build here — the two clippy passes already compile both
      # targets; the Docker job does the full build + smoke test. See README (CI split).

  docker:
    name: Docker image build + run
    runs-on: namespace-profile-dev
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the deploy image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: leptos-chfun:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image and smoke-check (:80, non-root)
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --rm -p 8080:80 --name lc-ci leptos-chfun:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 60 ]; then
              echo "container did not become healthy"; exit 1
            fi
            sleep 2
          done
          test "$(curl -fsS http://localhost:8080/healthz)" = "ok"
          test "$(curl -fsS http://localhost:8080/version)" = "${EXPECTED_SHA}"
          html="$(curl -fsS http://localhost:8080/)"
          printf '%s' "$html" | grep -q "Chean Hui Toh"
          for ext in css js wasm; do
            url="$(printf '%s' "$html" | grep -oE "/pkg/leptos-chfun\.[A-Za-z0-9_-]+\.${ext}" | head -1)"
            test -n "$url" || { echo "no content-hashed /pkg *.${ext} URL in HTML (hash-files regressed?)"; exit 1; }
            curl -fsS "http://localhost:8080${url}" -o /dev/null
            echo "  served ${url}"
          done
          uid="$(docker exec lc-ci id -u)"
          test "${uid}" != "0"
          echo "OK: healthy on :80, /version matches, non-root (uid=${uid})"
          docker rm -f lc-ci
