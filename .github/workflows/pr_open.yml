name: PR Open

# Runs on every PR targeting mainline AND on every direct push to mainline.
# Responsibility: prove the change is formatted, passes clippy on BOTH the
# server (ssr) and client (hydrate/wasm) sides, and produces a valid
# cargo-leptos build. No deployment happens here.

on:
  pull_request:
    branches: [mainline]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [mainline]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Format, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Draft PRs get skipped, but push events have no draft field so they always run.
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (stable + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          shared-key: leptos-chfun-ci

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Two clippy passes: the server (ssr, native) and the client
      # (hydrate, wasm32). NEVER use `--all-features` on the wasm target — it
      # enables `ssr`, which pulls in Tokio's `net` feature (mio), and mio does
      # not compile for wasm ("This wasm target is unsupported by mio").
      - name: Clippy (server / ssr, native)
        run: cargo clippy --features ssr -- -D warnings

      - name: Clippy (client / hydrate, wasm32)
        run: cargo clippy --lib --target wasm32-unknown-unknown --features hydrate -- -D warnings

      - name: Install cargo-leptos
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@0.3.7

      # Debug build (compile + wasm-bindgen + site assembly). Deliberately NOT
      # --release: the release build runs wasm-opt, and cargo-leptos's wasm-opt
      # handling is unreliable on the bare ubuntu-latest runner (its
      # auto-downloaded wasm-opt fails to spawn — ENOENT at src/ext/sync.rs:83).
      # The optimized release build AND a running-container smoke test are fully
      # covered by the "Docker image build + run" job below, so this fast job
      # keeps a compile/assemble check without the flaky release optimizer.
      - name: Build (cargo-leptos, debug)
        run: cargo leptos build

      # cargo-leptos emits the client bundle to target/site (the analog of the
      # old Trunk dist/). The full SSR deployable is the Docker image built on
      # tag in build-and-deploy.yml; this artifact is a build-output check.
      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: target/site
          retention-days: 7
          if-no-files-found: error

  docker:
    name: Docker image build + run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the deploy image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: leptos-chfun:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image and smoke-check (:80, non-root)
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --rm -p 8080:80 --name lc-ci leptos-chfun:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 60 ]; then
              echo "container did not become healthy"; exit 1
            fi
            sleep 2
          done
          test "$(curl -fsS http://localhost:8080/healthz)" = "ok"
          test "$(curl -fsS http://localhost:8080/version)" = "${EXPECTED_SHA}"
          curl -fsS http://localhost:8080/ | grep -q "Chean Hui Toh"
          # The hydration assets must actually serve from the container's site
          # root, or the page renders but can't hydrate.
          curl -fsS http://localhost:8080/pkg/leptos-chfun.js   -o /dev/null
          curl -fsS http://localhost:8080/pkg/leptos-chfun.wasm -o /dev/null
          uid="$(docker exec lc-ci id -u)"
          test "${uid}" != "0"
          echo "OK: healthy on :80, /version matches, non-root (uid=${uid})"
          docker rm -f lc-ci
