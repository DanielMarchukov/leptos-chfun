name: Import secrets and variables to Depot CI
on: push

permissions:
  id-token: write
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          unset DEPOT_TOKEN
          depot ci secrets add CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" --repo DanielMarchukov/leptos-chfun
  variables:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import variables
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          unset DEPOT_TOKEN
          depot ci vars add CLOUDFLARE_ZONE_ID="$CLOUDFLARE_ZONE_ID" DEPLOY_ENABLED="$DEPLOY_ENABLED" PUBLIC_BASE_URL="$PUBLIC_BASE_URL" --repo DanielMarchukov/leptos-chfun
