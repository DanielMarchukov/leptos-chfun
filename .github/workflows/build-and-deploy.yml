name: Build and Deploy

# =====================================================================
# Tag-triggered release pipeline. Replaces release.yml.
#
# Flow on `git push --tags`:
#   1. Build the Docker image on Actions hardware (16 GB RAM, fast),
#      using BuildKit + GitHub Actions cache so warm rebuilds are quick.
#   2. Push to GHCR with three tags: vX.Y.Z (from the git tag),
#      latest, and sha-<short> for unambiguous rollbacks.
#   3. POST Dokploy /api/application.deploy so Dokploy pulls the
#      freshly pushed image and restarts the container.
#   4. Poll PUBLIC_BASE_URL/healthz until 200.
#   5. Purge Cloudflare edge cache.
#
# The Dokploy app MUST be configured with Source = Docker Image
# pointing at ghcr.io/<owner>/leptos-chfun:latest. The Dokploy
# tag-webhook trigger MUST be disabled (otherwise it races with this
# workflow's explicit API deploy call).
#
# Required configuration:
#   secrets.DOKPLOY_API_KEY        from Dokploy -> Profile -> API
#   secrets.CLOUDFLARE_API_TOKEN   scoped Zone.Cache Purge on chpilates.fun
#   vars.DOKPLOY_URL               Base URL of the Dokploy panel
#   vars.DOKPLOY_APPLICATION_ID    UUID of the Dokploy application
#   vars.PUBLIC_BASE_URL           https://chpilates.fun
#   vars.CLOUDFLARE_ZONE_ID        Zone ID of chpilates.fun
#   vars.DEPLOY_ENABLED            "true" to arm the deploy job
# =====================================================================

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

# Workflow-level default: read-only. The build-and-push job overrides
# locally to add packages:write so GHCR push is scoped to one job, not
# inherited by the deploy job which only makes HTTP API calls.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/leptos-chfun

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write    # required to push to GHCR
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Don't write GITHUB_TOKEN into .git/config after checkout.
          # Nothing in this job runs git operations against the remote
          # — Buildx, metadata-action, and build-push-action all read
          # the workspace as files.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=true
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GIT_SHA is compiled into the server binary via option_env! and
          # served by the axum app at /version, so the deploy job can prove the
          # running container is THIS build, not the previous one.
          build-args: |
            GIT_SHA=${{ github.sha }}
          # GHA cache is per-repo, persists between runs and is free.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Single-platform amd64 build on the standard runner. The SSR server
          # binary is arch-specific, so confirm the VPS arch (`uname -m`) matches;
          # if the box is arm64, add `platforms: linux/arm64` + a native arm
          # runner (QEMU-cross-compiling a full Leptos build is very slow).

  deploy:
    name: Trigger Dokploy deploy, verify, purge cache
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Assert required configuration
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${DOKPLOY_URL:-}" ]            || missing+=("vars.DOKPLOY_URL")
          [ -n "${DOKPLOY_APPLICATION_ID:-}" ] || missing+=("vars.DOKPLOY_APPLICATION_ID")
          [ -n "${DOKPLOY_API_KEY:-}" ]        || missing+=("secrets.DOKPLOY_API_KEY")
          [ -n "${PUBLIC_BASE_URL:-}" ]        || missing+=("vars.PUBLIC_BASE_URL")
          [ -n "${CLOUDFLARE_ZONE_ID:-}" ]     || missing+=("vars.CLOUDFLARE_ZONE_ID")
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ]   || missing+=("secrets.CLOUDFLARE_API_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required configuration:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          set -euo pipefail
          # Dokploy pulls the freshly pushed image (ghcr.io/.../:latest)
          # and restarts the container. No build happens on the VPS.
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"${DOKPLOY_APPLICATION_ID}\"}" \
            "${DOKPLOY_URL%/}/api/application.deploy"

      # Ask Dokploy directly whether the rollout succeeded, instead of polling
      # the public /version through Cloudflare (Bot Fight Mode challenges the CI
      # request and the poll times out). pr_open.yml's docker job already proves
      # THIS image serves the correct SHA on :80 non-root; here we only confirm
      # Dokploy rolled it out. applicationStatus: idle | running | done | error.
      # NOTE: not yet validated against a live Dokploy response — confirm the
      # `applicationStatus` field name and the running->done transition on first
      # real deploy, and adjust if application.deploy returns a deployment id to
      # poll via /api/deployment.all instead.
      - name: Wait for Dokploy rollout to finish
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          set -euo pipefail
          api="${DOKPLOY_URL%/}/api/application.one?applicationId=${DOKPLOY_APPLICATION_ID}"
          app_status() {
            curl --fail-with-body --silent --show-error --max-time 10 \
              -H "x-api-key: ${DOKPLOY_API_KEY}" "${api}" \
            | jq -r '.applicationStatus // ""'
          }
          seen_running=false
          fails=0
          # ~16 min worst-case cap: 48 * (<=10s curl + 10s sleep). Stays under
          # the 20-min job timeout so the loop's own timeout branch below can
          # run (and the job isn't SIGKILLed mid-poll, skipping the purge step).
          for attempt in $(seq 1 48); do
            # pipefail makes app_status fail if the curl fails, so a bad URL /
            # API key / app id surfaces as a request failure rather than a masked
            # empty status retried for 16 min and mislabeled a rollout timeout.
            if ! st="$(app_status)"; then
              fails=$((fails + 1))
              echo "attempt ${attempt}: Dokploy API request failed (${fails} in a row)"
              if [ "${fails}" -ge 3 ]; then
                echo "Dokploy API failed ${fails}x in a row — check DOKPLOY_URL, DOKPLOY_API_KEY, DOKPLOY_APPLICATION_ID."
                exit 1
              fi
              sleep 10
              continue
            fi
            fails=0
            echo "attempt ${attempt}: applicationStatus='${st}'"
            case "${st}" in
              running) seen_running=true ;;
              error)   echo "Dokploy reports the deploy failed."; exit 1 ;;
              done)
                if [ "${seen_running}" = true ]; then
                  echo "Dokploy rollout complete."; exit 0
                fi
                # 'done' before we ever saw 'running' is likely the previous
                # deploy's terminal state; keep waiting for this rollout to start.
                ;;
            esac
            sleep 10
          done
          echo "Dokploy rollout did not complete in time."
          exit 1

      - name: Purge Cloudflare edge cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache"
