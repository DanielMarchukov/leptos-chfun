name: Build and Deploy

# Tag-push release pipeline: build -> push GHCR -> trigger Dokploy deploy ->
# poll rollout -> purge Cloudflare. Dokploy app must be Source=Docker Image
# with its tag-webhook trigger disabled. See README (Key decisions).
#
# Required configuration:
#   secrets.DOKPLOY_API_KEY        Dokploy -> Profile -> API
#   secrets.CLOUDFLARE_API_TOKEN   Zone.Cache Purge on chpilates.fun
#   vars.DOKPLOY_URL               Dokploy panel base URL
#   vars.DOKPLOY_APPLICATION_ID    Dokploy application UUID
#   vars.CLOUDFLARE_ZONE_ID        Zone ID of chpilates.fun
#   vars.DEPLOY_ENABLED            "true" to arm the deploy job

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

# Read-only by default; build-and-push adds packages:write locally so GHCR
# push is scoped to that job only.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/leptos-chfun

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write    # required to push to GHCR
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # No git operations against the remote in this job; avoid writing
          # the token into .git/config.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=true
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Compiled in via option_env! and served at /version — the PR docker
          # smoke test asserts it; here it just stamps the image with its commit.
          build-args: |
            GIT_SHA=${{ github.sha }}
          # GHA cache is per-repo, persists between runs and is free.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64-only; if the VPS is arm64, add platforms: linux/arm64 + a
          # native arm runner (QEMU cross-compile is slow for a full Leptos build).

  deploy:
    name: Trigger Dokploy deploy, verify, purge cache
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Assert required configuration
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${DOKPLOY_URL:-}" ]            || missing+=("vars.DOKPLOY_URL")
          [ -n "${DOKPLOY_APPLICATION_ID:-}" ] || missing+=("vars.DOKPLOY_APPLICATION_ID")
          [ -n "${DOKPLOY_API_KEY:-}" ]        || missing+=("secrets.DOKPLOY_API_KEY")
          [ -n "${CLOUDFLARE_ZONE_ID:-}" ]     || missing+=("vars.CLOUDFLARE_ZONE_ID")
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ]   || missing+=("secrets.CLOUDFLARE_API_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required configuration:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          set -euo pipefail
          # Dokploy pulls the freshly pushed image and restarts the container.
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"${DOKPLOY_APPLICATION_ID}\"}" \
            "${DOKPLOY_URL%/}/api/application.deploy"

      # Best-effort rollout signal: poll Dokploy's applicationStatus (Cloudflare
      # Bot Fight Mode blocks a CI /version poll). NOT correlated to this specific
      # deploy/SHA — the PR docker job is the authoritative proof the built image
      # serves the right commit on :80. Validated on live deploys (v0.3.0,
      # v0.3.1): the running->done transition and clean exit were observed.
      # See README (Key decisions).
      - name: Wait for Dokploy rollout to finish
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          set -euo pipefail
          api="${DOKPLOY_URL%/}/api/application.one?applicationId=${DOKPLOY_APPLICATION_ID}"
          app_status() {
            curl --fail-with-body --silent --show-error --max-time 10 \
              -H "x-api-key: ${DOKPLOY_API_KEY}" "${api}" \
            | jq -r '.applicationStatus // ""'
          }
          seen_running=false
          fails=0
          # ~16 min worst-case cap, under the 20-min job timeout.
          for attempt in $(seq 1 48); do
            # A bad URL/key/id (pipefail on curl) OR a missing/empty
            # applicationStatus is a contract failure, not a "keep waiting".
            if ! st="$(app_status)" || [ -z "${st}" ]; then
              fails=$((fails + 1))
              echo "attempt ${attempt}: Dokploy request failed or returned no applicationStatus (${fails} in a row)"
              if [ "${fails}" -ge 3 ]; then
                echo "Dokploy API failed ${fails}x in a row — check DOKPLOY_URL, DOKPLOY_API_KEY, DOKPLOY_APPLICATION_ID."
                exit 1
              fi
              sleep 10
              continue
            fi
            echo "attempt ${attempt}: applicationStatus='${st}'"
            # Contract is idle|running|done|error. Reset the failure counter only
            # for a recognized state; an unknown value is treated like a request
            # failure so a changed API shape can't silently spin to the timeout.
            case "${st}" in
              running) seen_running=true; fails=0 ;;
              idle)    fails=0 ;;
              done)
                if [ "${seen_running}" = true ]; then
                  echo "Dokploy rollout complete."; exit 0
                fi
                # 'done' before we ever saw 'running' is likely the previous
                # deploy's terminal state; keep waiting for this rollout to start.
                fails=0
                ;;
              error)   echo "Dokploy reports the deploy failed."; exit 1 ;;
              *)
                fails=$((fails + 1))
                echo "attempt ${attempt}: unexpected applicationStatus '${st}' (${fails} in a row)"
                [ "${fails}" -ge 3 ] && { echo "Unexpected Dokploy status '${st}' — the API contract may have changed."; exit 1; }
                ;;
            esac
            sleep 10
          done
          echo "Dokploy rollout did not complete in time."
          exit 1

      - name: Purge Cloudflare edge cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache"
