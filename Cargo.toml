[package]
name = "leptos-chfun"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Group lints opt in at warn; individual lints can override via `allow`/`deny`
# below. priority = -1 keeps targeted overrides authoritative.
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
