server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------- Security headers ----------------
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # ---------------- Compression ----------------
    # Cloudflare also compresses at the edge, but origin gzip saves
    # bandwidth on the CF <-> origin hop.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        application/xml+rss
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ---------------- MIME ----------------
    # nginx 1.21+ already maps .wasm; explicit here to survive base image churn.
    types {
        application/wasm wasm;
    }

    # ---------------- Healthcheck ----------------
    # Used by the Dockerfile HEALTHCHECK, Traefik, and any uptime probe.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------- Hashed assets: immutable forever ----------------
    # Trunk emits filenames like leptos-chfun-<hash>.{js,wasm}, so the URL
    # changes whenever the content does — safe to cache for a year.
    location ~* \.(wasm|js|css|woff2?|png|jpe?g|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ---------------- SPA fallback + index.html no-cache ----------------
    # leptos_router (when added) needs unknown paths to fall through to
    # index.html so the client-side router can take over.
    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
