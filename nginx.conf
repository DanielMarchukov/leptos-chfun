server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------- Security headers ----------------
    # Merge inheritance so location-level add_header (Cache-Control on asset
    # routes, Content-Type on /healthz) APPENDS to these instead of replacing
    # them. Default nginx behaviour is replace, which would silently strip
    # the security headers from every response that hits a location with its
    # own add_header. Requires nginx 1.29.3+ (we pin 1.31).
    add_header_inherit merge;

    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # ---------------- Compression ----------------
    # Cloudflare also compresses at the edge, but origin gzip saves
    # bandwidth on the CF <-> origin hop.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ---------------- MIME ----------------
    # Intentionally NO server-scope `types` block here. A `types` directive
    # at server or location level REPLACES the inherited http-context
    # `include mime.types` (it does not merge), so adding even one entry
    # silently strips .js, .css, .png, .svg, etc. down to application/octet-stream.
    # nginx 1.21+ ships application/wasm in the default mime.types — if the
    # base image is ever swapped to something older, add the wasm mapping
    # to mime.types itself (in the Dockerfile), not here.

    # ---------------- Healthcheck ----------------
    # Used by the Dockerfile HEALTHCHECK, Traefik, and any uptime probe.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------- Dotfile guard ----------------
    # Refuse any request for a hidden file (e.g. /.env, /.git/HEAD,
    # /foo/.DS_Store) so a stray dotfile in the build context can never be
    # served. /.well-known/ is exempt — typically used for security.txt
    # and ACME challenges (Traefik handles ACME at the edge, but harmless
    # to keep the path reachable in case we serve security.txt from here).
    location ~ /\.(?!well-known) {
        return 404;
        access_log off;
        log_not_found off;
    }

    # ---------------- Hashed assets: immutable forever ----------------
    # Match only Trunk's content-hashed filenames: <name>-<16+hex>.<ext>.
    # The hash segment is what makes "immutable" safe — any change of
    # content produces a different URL, so old responses can never be wrong.
    # Non-hashed assets (e.g. /favicon.ico, /robots.txt) deliberately do
    # NOT match this regex; they fall through to the SPA location below
    # and inherit no-cache, which is the conservative default until we
    # add an explicit revalidation tier for them.
    location ~* -[0-9a-f]{16,}\.(wasm|js|css|woff2?|png|jpe?g|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ---------------- SPA fallback + index.html no-cache ----------------
    # leptos_router (when added) needs unknown paths to fall through to
    # index.html so the client-side router can take over.
    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
