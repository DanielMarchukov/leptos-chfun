# Depot CI Migration
# Source: .github/workflows/release.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Release (post-deploy)
# =====================================================================
# Triggered by tags matching v*. Dokploy auto-deploys on tag via its
# GitHub App webhook; this workflow's job is to wait for the new build
# to start serving and then purge Cloudflare's edge cache.
#
# Required configuration (Settings -> Secrets/Variables -> Actions):
#   secrets.CLOUDFLARE_API_TOKEN  scoped Zone.Cache Purge on chpilates.fun
#   vars.CLOUDFLARE_ZONE_ID       zone ID of chpilates.fun
#   vars.PUBLIC_BASE_URL          https://chpilates.fun
#   vars.DEPLOY_ENABLED           "true" to arm; absent/"false" no-ops
#
# Note: Dokploy itself triggers the deploy on receiving the tag webhook.
# This workflow does NOT call /api/application.deploy, to avoid racing
# with Dokploy's own webhook-driven build.
# =====================================================================
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  post-release:
    name: Verify deploy and purge Cloudflare
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 20
    environment: production
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Assert required configuration
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${PUBLIC_BASE_URL:-}" ]      || missing+=("vars.PUBLIC_BASE_URL")
          [ -n "${CLOUDFLARE_ZONE_ID:-}" ]   || missing+=("vars.CLOUDFLARE_ZONE_ID")
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=("secrets.CLOUDFLARE_API_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required configuration:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
      - name: Wait for Dokploy to publish new build
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          # Cold builds can take 8-10 minutes (compiling Leptos from scratch).
          # Poll /healthz for up to ~12 minutes (72 attempts x 10s).
          for attempt in $(seq 1 72); do
            if curl --fail --silent --show-error --max-time 10 \
                 -o /dev/null "${PUBLIC_BASE_URL%/}/healthz"; then
              echo "Site responded OK on attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt}: not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Site did not become healthy in time."
          exit 1
      - name: Purge Cloudflare edge cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache"
